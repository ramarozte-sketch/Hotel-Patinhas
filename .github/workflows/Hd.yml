name: Gerar APK (Hotel Patinhas HD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Escolher a versão mais recente do projeto
        shell: bash
        run: |
          # o projeto pode estar na raiz do repositório, numa pasta ou dentro de um HotelPatinhasHD.zip
          set -u
          best=""; bestv=-1
          ver(){ grep -m1 -oP '^version/code=\K[0-9]+' "$1/export_presets.cfg" 2>/dev/null || echo 0; }
          while IFS= read -r p; do
            d=$(dirname "$p"); v=$(ver "$d")
            echo "Projeto na pasta $d: versão $v"
            if [ "$v" -gt "$bestv" ]; then bestv=$v; best=$d; fi
          done < <(find . -name project.godot -not -path './.git/*' -not -path './_z/*')
          i=0
          while IFS= read -r z; do
            i=$((i+1)); t="_z/$i"; mkdir -p "$t"
            unzip -q -o "$z" -d "$t" || { echo "Não consegui abrir $z"; continue; }
            p=$(find "$t" -name project.godot | head -n 1); [ -z "$p" ] && continue
            d=$(dirname "$p"); v=$(ver "$d")
            echo "Zip $z: versão $v"
            if [ "$v" -gt "$bestv" ]; then bestv=$v; best=$d; fi
          done < <(find . -name '*.zip' -not -path './.git/*' -not -path './_z/*')
          if [ -z "$best" ]; then echo "Não encontrei o projeto. Envia o HotelPatinhasHD.zip para o repositório."; exit 1; fi
          name=$(grep -m1 -oP '^version/name="\K[^"]+' "$best/export_presets.cfg" || echo "?")
          echo "==> A compilar a versão $name a partir de: $best"
          echo "PROJ=$(realpath "$best")" >> "$GITHUB_ENV"
          echo "VER=$name" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guardar o Godot em cache
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Descarregar o Godot e os modelos de exportação
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz && rm templates.tpz
          # só são precisos os modelos de Android
          find templates -type f ! -name 'android*' ! -name 'version.txt' -delete

      - name: Preparar o Godot para Android
        shell: bash
        run: |
          set -e
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL" && cp -r ~/godot/templates/* "$TPL/"
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p ~/.config/godot
          MINOR=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          for f in editor_settings-4.tres editor_settings-${MINOR}.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
            sed -i 's/^          //' ~/.config/godot/$f
          done
          echo "SDK: $SDK"; ls "$SDK" || true

      - name: Importar o projeto
        shell: bash
        run: |
          cd "$PROJ"
          ~/godot/godot --headless --path . --import || true
          ~/godot/godot --headless --path . --import

      - name: Compilar o APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.PROJ }}/android/hotelhd.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: hotelhd
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: patinhas
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$PROJ"
          ~/godot/godot --headless --path . --export-release "Android" "$GITHUB_WORKSPACE/out/HotelPatinhasHD-v${VER}.apk"
          ls -la "$GITHUB_WORKSPACE/out"
          test -f "$GITHUB_WORKSPACE/out/HotelPatinhasHD-v${VER}.apk"

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: HotelPatinhasHD-v${{ env.VER }}
          path: out/*.apk
