name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Escolher a versão mais recente do projeto
        shell: bash
        run: |
          # escolhe, entre todos os projetos e zips do repositório, o que tem o versionCode mais alto
          set -u
          best=""; bestv=-1
          ver(){ grep -m1 -oP 'versionCode\s+\K[0-9]+' "$1/app/build.gradle" 2>/dev/null || echo 0; }
          while IFS= read -r s; do
            d=$(dirname "$s"); v=$(ver "$d")
            echo "Projeto na pasta $d: versionCode $v"
            if [ "$v" -gt "$bestv" ]; then bestv=$v; best=$d; fi
          done < <(find . -name settings.gradle -not -path './.git/*' -not -path './_z/*')
          i=0
          while IFS= read -r z; do
            i=$((i+1)); t="_z/$i"; mkdir -p "$t"
            unzip -q -o "$z" -d "$t" || { echo "Não consegui abrir $z"; continue; }
            s=$(find "$t" -name settings.gradle | head -n 1); [ -z "$s" ] && continue
            d=$(dirname "$s"); v=$(ver "$d")
            echo "Zip $z: versionCode $v"
            if [ "$v" -gt "$bestv" ]; then bestv=$v; best=$d; fi
          done < <(find . -name '*.zip' -not -path './.git/*' -not -path './_z/*')
          if [ -z "$best" ]; then echo "Não encontrei o projeto. Envia o HotelPatinhas.zip para o repositório."; exit 1; fi
          name=$(grep -m1 -oP 'versionName\s+"\K[^"]+' "$best/app/build.gradle" || echo "?")
          echo "==> A compilar a versão $name (versionCode $bestv) a partir de: $best"
          echo "PROJ=$best" >> "${GITHUB_ENV:-/dev/null}"
          echo "VER=$name" >> "${GITHUB_ENV:-/dev/null}"

      - name: Compilar o APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --stacktrace

      - name: Mudar o nome do APK
        run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" "HotelPatinhas-$VER.apk"

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          n
