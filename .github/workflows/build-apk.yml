name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Encontrar a pasta do projeto
        run: |
          DIR=$(dirname "$(find . -name settings.gradle -not -path '*/node_modules/*' | head -n 1)")
          if [ -z "$DIR" ] || [ "$DIR" = "." ] && [ ! -f settings.gradle ]; then
            echo "Não encontrei o settings.gradle no repositório."; exit 1
          fi
          echo "Projeto em: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - name: Compilar o APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --stacktrace

      - name: Mudar o nome do APK
        run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" HotelPatinhas.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: HotelPatinhas-apk
          path: HotelPatinhas.apk
          retention-days: 30
