name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Encontrar a pasta do projeto
        run: |
          echo "Ficheiros no repositório:"
          find . -path ./.git -prune -o -type f -print | head -n 50
          FOUND=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FOUND" ]; then
            ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "A descompactar $ZIP"
              mkdir -p _projeto && unzip -q -o "$ZIP" -d _projeto
              FOUND=$(find ./_projeto -name settings.gradle | head -n 1)
            fi
          fi
          if [ -z "$FOUND" ]; then
            echo "Não encontrei o projeto. Envia o HotelPatinhas.zip para o repositório."; exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "Projeto em: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - name: Compilar o APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --stacktrace

      - name: Mudar o nome do APK
        run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" HotelPatinhas.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: HotelPatinhas-apk
          path: HotelPatinhas.apk
          retention-days: 30
