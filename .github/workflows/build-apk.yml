name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Compilar o APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Mudar o nome do APK
        run: cp app/build/outputs/apk/release/app-release.apk HotelPatinhas.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: HotelPatinhas-apk
          path: HotelPatinhas.apk
          retention-days: 30
