name: Gerar APK (Hotel Patinhas HD)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-v3-4.7.2

      - name: Compilar o APK
        run: unzip -q -o $(find . -name HotelPatinhasHD*.zip | head -n 1) -d _hd && bash _hd/HotelPatinhasHD/ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HotelPatinhasHD-apk
          path: out/*.apk
