      - name: Preparar o Godot para Android
        shell: bash
        run: |
          set -e
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL"
          cp -v ~/godot/templates/android_debug.apk ~/godot/templates/android_release.apk ~/godot/templates/android_source.zip ~/godot/templates/version.txt "$TPL/"
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p ~/.config/godot
          MINOR=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          for f in editor_settings-4.tres editor_settings-${MINOR}.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$SDK\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > ~/.config/godot/$f
            cat ~/.config/godot/$f
          done
          echo "SDK: $SDK"; ls "$SDK" || true
