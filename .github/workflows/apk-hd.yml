name: Gerar APK (Hotel Patinhas HD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Escolher a versão mais recente do projeto
        shell: bash
        run: |
          # o projeto pode estar na raiz do repositório, numa pasta ou dentro de um HotelPatinhasHD.zip
          set -u
          best=""; bestv=-1
          ver(){ grep -m1 -oP '^version/code=\K[0-9]+' "$1/export_presets.cfg" 2>/dev/null || echo 0; }
          while IFS= read -r p; do
            d=$(dirname "$p"); v=$(ver "$d")
            echo "Projeto na pasta $d: versão $v"
            if [ "$v" -gt "$bestv" ]; then bestv=$v; best=$d; fi
          done < <(find . -name project.godot -not -path './.git/*' -not -path './_z/*')
          i=0
          while IFS= read -r z; do
            i=$((i+1)); t="_z/$i"; mkdir -p "$t"
            unzip -q -o "$z" -d "$t" || { echo "Não consegui abrir $z"; continue; }
            p=$(find "$t" -name project.godot | head -n 1); [ -z "$p" ] && continue
            d=$(dirname "$p"); v=$(ver "$d")
            echo "Zip $z: versão $v"
            if [ "$v" -gt "$bestv" ]; then bestv=$v; best=$d; fi
          done < <(find . -name '*.zip' -not -path './.git/*' -not -path './_z/*')
          if [ -z "$best" ]; then echo "Não encontrei o projeto. Envia o HotelPatinhasHD.zip para o repositório."; exit 1; fi
          name=$(grep -m1 -oP '^version/name="\K[^"]+' "$best/export_presets.cfg" || echo "?")
          echo "==> A compilar a versão $name a partir de: $best"
          echo "PROJ=$(realpath "$best")" >> "$GITHUB_ENV"
          echo "VER=$name" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Guardar o Godot em cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-v2-${{ env.GODOT_VERSION }}

      - name: Descarregar o Godot e os modelos de exportação
        shell: bash
        run: |
          set -e
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -x godot ]; then
            echo "A descarregar o Godot ${GODOT_VERSION}..."
            curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q -o godot.zip && rm godot.zip
            mv -f Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
            chmod +x godot
          fi
          if [ ! -f templates/android_release.apk ]; then
            echo "A descarregar os modelos de exportação (cerca de 1,3 GB)..."
            rm -rf templates
            curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q -o templates.tpz 'templates/a
